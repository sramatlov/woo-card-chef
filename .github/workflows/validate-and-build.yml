name: Validate and build plugin zip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_DIR: wc-product-card-elementor
  MAIN_FILE: wc-product-card-elementor.php

jobs:
  php-lint:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.3"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require plugin source
        shell: bash
        run: test -f "${PLUGIN_DIR}/${MAIN_FILE}"

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find "${PLUGIN_DIR}" -type f -name '*.php' -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found in ${PLUGIN_DIR}." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

  build:
    name: Validate metadata and build install zip
    needs: php-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Validate plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_plugin_metadata.py \
            --plugin-dir "${PLUGIN_DIR}" \
            --main-file "${MAIN_FILE}"

      - name: Read plugin version
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="$(python tools/validate_plugin_metadata.py \
            --plugin-dir "${PLUGIN_DIR}" \
            --main-file "${MAIN_FILE}" \
            --version-only)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build WordPress install zip
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_wordpress_plugin_zip.py \
            --source-dir "${PLUGIN_DIR}" \
            --destination-zip "dist/woo-card-chef-v${{ steps.plugin.outputs.version }}-wordpress-install.zip" \
            --plugin-slug "${PLUGIN_DIR}" \
            --main-file "${MAIN_FILE}"

      - name: Upload install zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: woo-card-chef-v${{ steps.plugin.outputs.version }}-wordpress-install
          path: dist/woo-card-chef-v${{ steps.plugin.outputs.version }}-wordpress-install.zip
          if-no-files-found: error
          retention-days: 14
